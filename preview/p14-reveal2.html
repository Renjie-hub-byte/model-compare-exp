<div class="stage" style="width:1920px;height:1080px;position:relative;background:#f5f5f7;overflow:hidden;font-family:'PingFang SC','Microsoft YaHei',sans-serif;">
  <style>
    @keyframes slamIn { 0%{transform:scale(3.2) rotate(-9deg);opacity:0;} 55%{transform:scale(.96) rotate(1.5deg);opacity:1;} 68%{transform:scale(1.05) rotate(-1deg);} 80%{transform:scale(.99) rotate(.5deg);} 100%{transform:scale(1) rotate(0);opacity:1;} }
    @keyframes ringOut { 0%{transform:scale(.3);opacity:.85;} 100%{transform:scale(1.6);opacity:0;} }
    @keyframes stampIn { 0%{transform:scale(2.6) rotate(14deg);opacity:0;} 60%{transform:scale(1) rotate(-6deg);opacity:1;} 75%{transform:scale(1.12) rotate(-6deg);} 100%{transform:scale(1) rotate(-6deg);opacity:1;} }
    .card{animation:slamIn .55s cubic-bezier(.2,.9,.3,1.2) both;}
    .ring{animation:ringOut .7s ease-out both;}
    .stamp{animation:stampIn .45s cubic-bezier(.2,.9,.3,1.3) both;}
  </style>
  <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;">
    <div style="position:absolute;width:1300px;height:760px;border-radius:60px;background:radial-gradient(closest-side,#34c75933,transparent);"></div>
    <div class="ring anim" data-in="0.75" data-dur="0.7" style="position:absolute;width:1300px;height:760px;border-radius:60px;border:10px solid #34c759;"></div>
    <div class="card anim" data-in="0.15" data-dur="0.55" style="position:relative;width:1240px;background:#fff;border-radius:36px;box-shadow:0 40px 90px rgba(0,0,0,.28);padding:52px 64px;display:flex;gap:48px;align-items:center;">
      <img src="img-s2/v2-Flash_低思考.jpg" style="width:460px;border-radius:20px;border:1px solid #e5e5ea;box-shadow:0 12px 40px rgba(0,0,0,.18);">
      <div style="flex:1;">
        <div style="font-size:30px;color:#86868b;font-weight:700;letter-spacing:6px;margin-bottom:14px;">身份揭晓</div>
        <div style="font-size:58px;font-weight:900;color:#1d1d1f;line-height:1.25;margin-bottom:26px;">二号 · 霓虹赛博风选手</div>
        <div style="font-size:34px;font-weight:800;color:#34c759;margin-bottom:30px;">闪电模型 · 低思考模式</div>
        <div style="display:flex;gap:22px;">
          <div style="background:#f5f5f7;border-radius:18px;padding:18px 30px;"><div style="font-size:22px;color:#86868b;">用时</div><div style="font-size:44px;font-weight:900;color:#1d1d1f;">25 秒</div></div>
          <div style="background:#f5f5f7;border-radius:18px;padding:18px 30px;"><div style="font-size:22px;color:#86868b;">花费</div><div style="font-size:44px;font-weight:900;color:#1d1d1f;">不到 1 分钱</div></div>
        </div>
        <div style="font-size:27px;color:#1d1d1f;line-height:1.6;margin-top:28px;">扎实的逻辑和务实的方案：最小的消耗，也能爆发出很大的能量。</div>
      </div>
    </div>
    <div class="stamp anim" data-in="0.95" data-dur="0.45" style="position:absolute;right:150px;top:120px;padding:16px 40px;border:8px solid #34c759;border-radius:20px;font-size:56px;font-weight:900;color:#34c759;background:rgba(255,255,255,.9);letter-spacing:8px;">揭晓</div>
  </div>
</div><script>
(function(){
  function applySeek(t){
    if(!isFinite(t)) t = 0;
    if(t < 0) t = 0;
    var els = document.querySelectorAll('.anim');
    for(var i=0;i<els.length;i++){
      var el = els[i];
      var g0 = parseFloat(el.getAttribute('data-in')) || 0;
      var dur = parseFloat(el.getAttribute('data-dur')) || 1;
      if(dur <= 0) dur = 1;
      var elapsed = t - g0;
      if(elapsed < 0) elapsed = 0;
      else if(elapsed > dur) elapsed = dur;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = '-' + elapsed + 's';
    }
  }
  window.seek = applySeek;
  applySeek(0);
})();
</script>
