<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920,height=1080">
<title>scene:p01-hook type:widgets</title>
<style>

:root{
  --bg-0:#0b0e14;
  --bg-1:#151a24;
  --ink:#eef2f8;
  --ink-dim:#9aa7bd;
  --accent:#5bd0ff;
  --accent-2:#ffd479;
  --line:rgba(255,255,255,.10);
  --stage-w:1920px;
  --stage-h:1080px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
body{
  background:#000;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,
    "Segoe UI",sans-serif;
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:none;
}
.stage{
  position:relative;
  width:var(--stage-w);
  height:var(--stage-h);
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(1200px 700px at 50% -10%, var(--bg-1) 0%, var(--bg-0) 62%),
    var(--bg-0);
}

/* 共享 keyframes：模板通过给对应 class 声明 animation-name 引用 */
@keyframes rise{
  0%{opacity:0; transform:translateY(46px)}
  100%{opacity:1; transform:translateY(0)}
}
@keyframes fade{
  0%{opacity:0}
  100%{opacity:1}
}
@keyframes zoom{
  0%{opacity:0; transform:scale(.93)}
  100%{opacity:1; transform:scale(1)}
}

/* 所有被 seek 驱动的元素：暂停、双端填充、统一缓动 */
.anim{
  animation-play-state:paused;
  animation-fill-mode:both;
  animation-timing-function:cubic-bezier(.22,.61,.36,1);
  will-change:transform,opacity;
}

/* m01 背景钩子：data-bg 背景层（.stage 之下首个全屏层，内容层在其上） */
.stage{isolation:isolate}
.bg-layer{position:absolute;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
/* m01 背景钩子：光斑类背景（paper/cream/aurora）—— 960x540 设计框等比铺满 */
.bg-frame{position:absolute;left:0;top:0;width:960px;height:540px;overflow:hidden;transform:scale(2);transform-origin:0 0}
.bg-tex{position:absolute;inset:0}
.bg-blob{position:absolute;left:0;top:0;border-radius:50%;filter:blur(70px);opacity:.5}
/* 纹理逐字对齐样张库④ .bg-paper / ⑤⑥ 内联背景 */
.bg-paper-tex{background:repeating-linear-gradient(0deg,rgba(160,130,90,.05) 0 2px,transparent 2px 4px),repeating-linear-gradient(90deg,rgba(160,130,90,.04) 0 3px,transparent 3px 6px),linear-gradient(160deg,#f7f1e5,#efe4d0 60%,#e9dcc3)}
.bg-cream-tex{background:linear-gradient(150deg,#fdf3ec,#f6e3e0 55%,#efe0ea)}
.bg-aurora-tex{background:#0a0f24}
.wg-wrap{width:1560px;max-width:1560px;display:flex;flex-direction:column;gap:30px;
  padding-bottom:96px;}
.wg-card{position:relative;border:1px solid var(--line);border-radius:20px;
  padding:34px 44px;background:rgba(255,255,255,.035);
  display:flex;flex-direction:column;gap:20px;min-width:0;}
.wg-card{animation-name:rise}
.wg-label{font-size:40px;line-height:1.35;font-weight:600;color:var(--ink);
  overflow-wrap:anywhere;}
.wg-body{display:flex;flex-direction:column;gap:16px;min-width:0;}
.wg-more{border-style:dashed;opacity:.72;font-size:32px;color:var(--ink-dim);}

/* progress：进度条 + 联动百分比（宽度/数字由驱动器按 t 推进，easeInOut） */
.wgp-track{height:46px;border-radius:12px;background:rgba(255,255,255,.06);
  border:1px solid var(--line);overflow:hidden;}
.wgp-fill{height:100%;width:0%;border-radius:11px;
  background:linear-gradient(90deg,var(--accent),var(--accent-2));}
.wgp-pct{font-size:44px;font-weight:700;color:var(--accent-2);text-align:right;
  font-variant-numeric:tabular-nums;}

/* counter：大数字滚动（数值由驱动器按 t 推进，easeInOut；千分位固定逗号分组） */
.wgc-numrow{display:flex;align-items:baseline;justify-content:center;gap:16px;
  min-width:0;}
.wgc-num{font-size:150px;line-height:1.05;font-weight:800;color:var(--accent);
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere;text-align:center;}
.wgc-suffix{font-size:44px;color:var(--ink-dim);overflow-wrap:anywhere;}

/* typewriter：打字机 + 光标（字符数与光标可见性由驱动器按 t 推进） */
.wgt-line{display:flex;align-items:center;font-family:"SFMono-Regular",Menlo,
  Consolas,"Liberation Mono",monospace;font-size:42px;line-height:1.5;
  background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:12px;
  padding:22px 28px;min-height:110px;min-width:0;}
.wgt-text{overflow-wrap:anywhere;min-width:0;}
.wgt-caret{flex:0 0 auto;width:22px;height:44px;margin-left:10px;
  border-radius:3px;background:var(--accent);}

/* steps：步骤条（点亮进度由驱动器按 t 推进，每 1/len 周期点亮一个） */
.wgs-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
.wgs-step{font-size:38px;line-height:1.4;padding:18px 30px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink-dim);overflow-wrap:anywhere;}
.wgs-step.on{border-color:var(--accent);color:var(--ink);
  background:linear-gradient(90deg,rgba(91,208,255,.22),rgba(91,208,255,.06));}
.wgs-arrow{font-size:34px;color:var(--ink-dim);}

/* 两列网格：卡片数 ≥ _WIDGET_GRID_MIN 时启用；half 组件占一列，其余整行 */
.wg-wrap.wg-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;
  align-items:stretch;}
.wg-grid .wg-card.wg-full{grid-column:1/-1;}
/* 半宽 counter 的大数字随之降字号，避免 7 位数千分位文本换行 */
.wg-grid .wg-half .wgc-num{font-size:104px;}

/* 卡片化细化：序号角标 + 顶部渐变亮线（more 卡不参与） */
.wg-card.anim::before{content:"";position:absolute;top:0;left:44px;right:44px;
  height:3px;border-radius:0 0 4px 4px;
  background:linear-gradient(90deg,var(--accent),rgba(91,208,255,0));opacity:.6;}
.wg-idx{position:absolute;top:22px;right:28px;font-size:26px;font-weight:700;
  letter-spacing:2px;color:var(--ink-dim);opacity:.55;
  font-variant-numeric:tabular-nums;}

/* compare_slider：左右擦除对比（擦除比例/分割线位置由驱动器按 t 推进，
   分割线左=left_text、右=right_text，对照样张库⑤） */
.wgv-wrap{position:relative;height:240px;border-radius:14px;overflow:hidden;
  border:1px solid var(--line);min-width:0;}
.wgv-half{position:absolute;inset:0;display:flex;align-items:center;
  justify-content:center;padding:0 90px;text-align:center;min-width:0;}
.wgv-after{background:linear-gradient(135deg,rgba(91,208,255,.16),
  rgba(91,208,255,.05));}
.wgv-before{background:linear-gradient(135deg,rgba(255,212,121,.16),
  rgba(255,212,121,.05));}
.wgv-txt{font-size:40px;line-height:1.5;overflow-wrap:anywhere;max-width:100%;}
.wgv-split{position:absolute;top:0;bottom:0;width:4px;background:var(--ink);
  box-shadow:0 0 12px rgba(255,255,255,.45);}
.wgv-split::after{content:"↔";position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);background:var(--ink);color:#0b0e14;
  border-radius:50%;width:52px;height:52px;line-height:52px;text-align:center;
  font-size:26px;}

/* spotlight：关键词按时间点点亮（点亮状态由驱动器按 t 与 data-at 推进，
   状态切换无 transition，保证 seek 可重放，对照样张库⑥） */
.wgl-text{font-size:44px;line-height:1.85;overflow-wrap:anywhere;min-width:0;}
.wgl-hl{border-radius:8px;padding:2px 10px;}
.wgl-hl.on{background:rgba(255,212,121,.26);color:var(--accent-2);}

/* timeline：里程碑逐个点亮（点亮个数由驱动器按 t 推进，对照样张库⑦） */
.wgm-list{position:relative;display:flex;flex-direction:column;gap:18px;
  padding-left:34px;min-width:0;}
.wgm-list::before{content:"";position:absolute;left:9px;top:10px;bottom:10px;
  width:3px;border-radius:2px;background:var(--line);}
.wgm-item{position:relative;font-size:34px;line-height:1.45;
  color:var(--ink-dim);overflow-wrap:anywhere;}
.wgm-item::before{content:"";position:absolute;left:-31px;top:14px;width:15px;
  height:15px;border-radius:50%;background:rgba(255,255,255,.22);}
.wgm-item.on{color:var(--ink);}
.wgm-item.on::before{background:var(--accent-2);
  box-shadow:0 0 10px rgba(255,212,121,.6);}
.wgm-when{color:var(--accent);margin-right:14px;
  font-variant-numeric:tabular-nums;}
.wgm-item.on .wgm-when{color:var(--accent-2);}
.wgm-what{min-width:0;}

/* badges：徽章逐个亮起（点亮个数由驱动器按 t 推进，对照样张库⑧） */
.wgb-row{display:flex;flex-wrap:wrap;gap:18px;align-items:center;
  justify-content:center;min-width:0;}
.wgb-badge{font-size:36px;line-height:1.4;padding:14px 28px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--ink-dim);overflow-wrap:anywhere;}
.wgb-badge.on{border-color:var(--accent-2);color:var(--accent-2);
  background:rgba(255,212,121,.14);}

:root{--bg-0:#F7F6F0;--bg-1:#EAF4EC;--ink:#2E4038;--ink-dim:#71857A;--accent:#27B07A;--accent-2:#F07E3B;--line:rgba(46,64,56,.14)}.stage{background:linear-gradient(168deg,#F6FBF5 0%,#EFF7F1 46%,#FBF3E9 100%)}.cp-panel{background:rgba(255,255,255,.58);box-shadow:0 18px 40px rgba(46,64,56,.08)}.cp-panel.is-a{border-color:rgba(39,176,122,.45)}.cp-panel.is-b{border-color:rgba(240,126,59,.45)}.cp-panel.is-a .cp-badge{color:#fff}.cp-panel.is-b .cp-badge{color:#fff}.g-track{background:rgba(255,255,255,.6)}.wgt-line{background:rgba(39,176,122,.07);border:1px solid rgba(39,176,122,.22)}.wg-idx{opacity:.9}
</style>
</head>
<body>
<div class="stage" data-scene-id="p01-hook" data-scene-type="widgets">
<div class="bg-layer" data-bg="cream" aria-hidden="true">
<div class="bg-frame">
<div class="bg-tex bg-cream-tex"></div>
<div class="bg-blob" style="width:300px;height:300px;background:rgba(244,183,196,.5)"></div>
<div class="bg-blob" style="width:240px;height:240px;background:rgba(250,215,180,.55)"></div>
</div>
</div>
<div class="wg-wrap">
<div class="wg-card anim wg-half" data-in="0.12" data-dur="0.50">
<div class="wg-idx">01</div>
<div class="wg-label">曾经一个月花 1000 块 · 现在每月只用不到</div>
<div class="wg-body" data-wtype="counter" data-start="0.37" data-dur="1.80" data-to="200"><div class="wgc-numrow"><span class="wgc-num">0</span><span class="wgc-suffix">元</span></div></div>
</div>
<div class="wg-card anim wg-full" data-in="0.40" data-dur="0.50">
<div class="wg-idx">02</div>
<div class="wg-body" data-wtype="typewriter" data-start="0.65" data-dur="1.53"><div class="wgt-line"><span class="wgt-text" data-full="省钱系列 03 · 省得最大的一笔"></span><span class="wgt-caret"></span></div></div>
</div>
</div>
<script>
(function(){
  function clamp01(u){ return u < 0 ? 0 : (u > 1 ? 1 : u); }
  function easeInOut(u){
    u = clamp01(u);
    return u < 0.5 ? 4*u*u*u : 1 - Math.pow(-2*u + 2, 3) / 2;
  }
  function groupDigits(intStr){
    var neg = intStr.charAt(0) === '-';
    var digits = neg ? intStr.slice(1) : intStr;
    var out = '';
    var count = 0;
    for (var i = digits.length - 1; i >= 0; i--) {
      out = digits.charAt(i) + out;
      count++;
      if (count % 3 === 0 && i > 0) out = ',' + out;
    }
    return (neg ? '-' : '') + out;
  }
  function fmtValue(v, isInt){
    var txt = isInt ? String(Math.round(v)) : (Math.round(v * 10) / 10).toFixed(1);
    var dot = txt.indexOf('.');
    if (dot < 0) return groupDigits(txt);
    return groupDigits(txt.slice(0, dot)) + txt.slice(dot);
  }
  function numAttr(el, name, fallback){
    var v = parseFloat(el.getAttribute(name));
    return isFinite(v) ? v : fallback;
  }
  function updateWidget(el, t){
    var wtype = el.getAttribute('data-wtype') || '';
    var start = numAttr(el, 'data-start', 0);
    var local = t - start;
    var i, nodes, on;
    if (wtype === 'progress') {
      var durP = numAttr(el, 'data-dur', 1);
      if (durP <= 0) durP = 1;
      var to = numAttr(el, 'data-to', 0);
      var p = easeInOut(local / durP) * to;
      var fill = el.querySelector('.wgp-fill');
      if (fill) fill.style.width = p + '%';
      var num = el.querySelector('.wgp-num');
      if (num) num.textContent = fmtValue(p, to === Math.round(to));
    } else if (wtype === 'counter') {
      var durC = numAttr(el, 'data-dur', 1);
      if (durC <= 0) durC = 1;
      var target = numAttr(el, 'data-to', 0);
      var val = easeInOut(local / durC) * target;
      var out = el.querySelector('.wgc-num');
      if (out) out.textContent = fmtValue(val, target === Math.round(target));
    } else if (wtype === 'typewriter') {
      var durT = numAttr(el, 'data-dur', 1);
      if (durT <= 0) durT = 1;
      var line = el.querySelector('.wgt-text');
      if (line) {
        var full = line.getAttribute('data-full') || '';
        line.textContent = full.slice(0, Math.floor(clamp01(local / durT) * full.length));
      }
      var caret = el.querySelector('.wgt-caret');
      if (caret) {
        caret.style.visibility = (Math.floor(t * 2.4) % 2 === 0) ? 'visible' : 'hidden';
      }
    } else if (wtype === 'steps') {
      var stepDur = numAttr(el, 'data-step-dur', 0.8);
      if (stepDur <= 0) stepDur = 0.8;
      nodes = el.querySelectorAll('.wgs-step');
      on = Math.floor(local / stepDur);
      if (on > nodes.length - 1) on = nodes.length - 1;
      for (i = 0; i < nodes.length; i++) {
        nodes[i].className = 'wgs-step' + (i <= on ? ' on' : '');
      }
    } else if (wtype === 'compare_slider') {
      var durV = numAttr(el, 'data-dur', 1);
      if (durV <= 0) durV = 1;
      var pos = 4 + easeInOut(clamp01(local / durV)) * 92;
      var beforeHalf = el.querySelector('.wgv-before');
      if (beforeHalf) beforeHalf.style.clipPath = 'inset(0 ' + (100 - pos) + '% 0 0)';
      var splitBar = el.querySelector('.wgv-split');
      if (splitBar) splitBar.style.left = pos + '%';
    } else if (wtype === 'spotlight') {
      var marks = el.querySelectorAll('.wgl-hl');
      for (i = 0; i < marks.length; i++) {
        var at = numAttr(marks[i], 'data-at', 0);
        marks[i].className = 'wgl-hl' + (local >= at ? ' on' : '');
      }
    } else if (wtype === 'timeline') {
      var tlDur = numAttr(el, 'data-step-dur', 0.8);
      if (tlDur <= 0) tlDur = 0.8;
      nodes = el.querySelectorAll('.wgm-item');
      on = Math.floor(local / tlDur);
      if (on > nodes.length - 1) on = nodes.length - 1;
      for (i = 0; i < nodes.length; i++) {
        nodes[i].className = 'wgm-item' + (i <= on ? ' on' : '');
      }
    } else if (wtype === 'badges') {
      var bgDur = numAttr(el, 'data-step-dur', 0.6);
      if (bgDur <= 0) bgDur = 0.6;
      nodes = el.querySelectorAll('.wgb-badge');
      on = Math.floor(local / bgDur);
      if (on > nodes.length - 1) on = nodes.length - 1;
      for (i = 0; i < nodes.length; i++) {
        nodes[i].className = 'wgb-badge' + (i <= on ? ' on' : '');
      }
    }
  }
  function applyWidgets(t){
    var roots = document.querySelectorAll('[data-wtype]');
    for (var i = 0; i < roots.length; i++) updateWidget(roots[i], t);
  }
  function install(){
    if (window.__widgetsSeekReady) return;
    window.__widgetsSeekReady = true;
    var prevSeek = window.seek;
    window.seek = function(t){
      var tt = (typeof t === 'number' && isFinite(t) && t > 0) ? t : 0;
      if (typeof prevSeek === 'function') prevSeek(tt);
      applyWidgets(tt);
    };
    applyWidgets(0);
  }
  if (typeof window.seek === 'function') {
    install();
  } else {
    document.addEventListener('DOMContentLoaded', install, false);
  }
})();
</script>
</div>
<script>

(function(){
  var SEEK_KEY = '--seek';
  function applySeek(t){
    if(!isFinite(t)) t = 0;
    if(t < 0) t = 0;
    var stage = document.querySelector('.stage');
    if(stage) stage.style.setProperty(SEEK_KEY, String(t));
    var els = document.querySelectorAll('.anim');
    var i, el, g0, dur, elapsed;
    for(i=0;i<els.length;i++){
      el = els[i];
      g0 = parseFloat(el.getAttribute('data-in')) || 0;
      dur = parseFloat(el.getAttribute('data-dur')) || 1;
      if(dur <= 0) dur = 1;
      elapsed = t - g0;
      if(elapsed < 0) elapsed = 0;
      else if(elapsed > dur) elapsed = dur;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = '-' + elapsed + 's';
    }
  }
  window.seek = applySeek;
  applySeek(0);
})();

</script>
<script>
(function () {
  var layer = document.querySelector('[data-bg="cream"]');
  if (!layer) return;
  var frameBox = layer.querySelector('.bg-frame');
  if (!frameBox) return;
  /* 漂移参数逐字对齐样张库 driftBlob(...)：[rx, ry, sp, ph, w, h]
     （w/h 为样张光斑内联尺寸；父盒即 960x540 设计框常量，免布局测量） */
  var PARAMS = [
    [0.32, 0.26, 0.2, 1.0, 300, 300],
    [0.28, 0.3, 0.16, 3.6, 240, 240]
  ];
  var els = layer.querySelectorAll('.bg-blob');
  var blobs = [];
  for (var i = 0; i < els.length && i < PARAMS.length; i++) {
    blobs.push({ el: els[i], rx: PARAMS[i][0], ry: PARAMS[i][1],
                 sp: PARAMS[i][2], ph: PARAMS[i][3], w: PARAMS[i][4], h: PARAMS[i][5] });
  }
  function frame(t) {
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i];
      var x = 960 * (.5 + b.rx * Math.sin(t * b.sp + b.ph)) - b.w / 2;
      var y = 540 * (.5 + b.ry * Math.cos(t * b.sp * .8 + b.ph)) - b.h / 2;
      b.el.style.transform = 'translate(' + x + 'px,' + y + 'px)';
    }
  }

  /* seek(t) 挂载：先驱动既有 .anim 动画，再刷新背景帧；同 t 必得同画面 */
  var prevSeek = window.seek;
  window.seek = function (raw) {
    var t = +raw;
    if (!isFinite(t) || t < 0) t = 0;
    if (typeof prevSeek === 'function') prevSeek(t);
    frame(t);
  };
  frame(0);
})();
</script>
</body>
</html>
